# Alternative au déploiement systemd. Deux services : l'application, et un ntfy
# auto-hébergé optionnel. Le serveur LLM local (partagé avec OpenHands) reste
# hors de ce compose — il est atteint via LLM_BASE_URL sur le réseau hôte.

services:
  ramtracker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ramtracker:local
    command: ["ramtracker", "loop"]
    env_file: ../.env
    environment:
      RAMTRACKER_DB_PATH: /data/ramtracker.db
      # Atteint le LLM local d'OpenHands sur l'hôte.
      LLM_BASE_URL: http://host.docker.internal:8080/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ramtracker-data:/data
      - ./backups:/backups
    restart: unless-stopped
    # Ne jamais préempter OpenHands sur le GPU/CPU.
    cpu_shares: 256
    deploy:
      resources:
        limits:
          memory: 512M

  # Optionnel : ntfy auto-hébergé. Sinon, utiliser ntfy.sh et retirer ce bloc.
  ntfy:
    image: binwiederhier/ntfy:latest
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    restart: unless-stopped
    profiles: ["self-hosted-ntfy"]

volumes:
  ramtracker-data:
  ntfy-cache:
