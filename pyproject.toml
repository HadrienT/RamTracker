[project]
name = "ramtracker"
version = "0.1.0"
description = "Agent de veille sur le marché de la mémoire serveur DDR4 ECC d'occasion"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "PyYAML>=6.0",
    "python-ulid>=2.5",
    "zstandard>=0.22",
]

[project.optional-dependencies]
remote-llm = ["anthropic>=0.34"]
feedback = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ramtracker = "ramtracker.runtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramtracker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
# PLC0415 : les imports tardifs sont délibérés — ils gardent les contrats
# d'architecture (import-linter D1→D5) propres pour les chargeurs de config.
# N818 : les noms d'exceptions sont normatifs (blueprint/07-ERRORS-AND-LOGGING.md).
# RUF001-003 : typographie française délibérée (× — ’) dans le texte.
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "PLC0415", "N818", "RUF001", "RUF002", "RUF003", "UP047",
    "SIM102", "SIM103",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ramtracker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*", "zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: cascade complète contre le corpus doré (pas de réseau)",
    "contract: collecteurs contre charges utiles figées (pas de réseau)",
    "property: tests hypothesis sur I1 et la grammaire (pas de réseau)",
    "live: appels réels aux API externes (exclu de la CI)",
]
addopts = "-m 'not live' --strict-markers"

[tool.coverage.run]
source = ["ramtracker"]
branch = true

[tool.importlinter]
root_package = "ramtracker"

[[tool.importlinter.contracts]]
name = "D1 — core ne dépend d'aucun autre package"
type = "forbidden"
source_modules = ["ramtracker.core"]
forbidden_modules = [
    "ramtracker.collect",
    "ramtracker.extract",
    "ramtracker.decide",
    "ramtracker.notify",
    "ramtracker.runtime",
]

[[tool.importlinter.contracts]]
name = "D2/D3/D4 — les packages métier n'importent que core"
type = "forbidden"
source_modules = [
    "ramtracker.collect",
    "ramtracker.extract",
    "ramtracker.decide",
    "ramtracker.notify",
]
forbidden_modules = ["ramtracker.runtime"]

[[tool.importlinter.contracts]]
name = "D3 — extract n'importe pas collect"
type = "forbidden"
source_modules = ["ramtracker.extract"]
forbidden_modules = ["ramtracker.collect", "ramtracker.decide", "ramtracker.notify"]

[[tool.importlinter.contracts]]
name = "D4 — decide n'importe ni collect ni notify"
type = "forbidden"
source_modules = ["ramtracker.decide"]
forbidden_modules = ["ramtracker.collect", "ramtracker.notify"]

[[tool.importlinter.contracts]]
name = "D5 — runtime est le seul à câbler les quatre métiers ; layering"
type = "layers"
layers = [
    "ramtracker.runtime",
    "ramtracker.decide | ramtracker.notify",
    "ramtracker.collect | ramtracker.extract",
    "ramtracker.core",
]
